openapi: 3.0.3
info:
  title: Цифровой Управляющий Мероприятиями - Participant Registration API
  version: 1.0.0
  description: |
    API для регистрации участников мероприятия, авторизации, управления
    группами и подачи заявок на участие в секции мероприятия.

    Покрываемые флоу:
      1. Регистрация участника (заявка + подтверждение по e-mail).
      2. Авторизация по одноразовому паролю (OTP), отправляемому на e-mail.
      3. Создание группы лидером и добавление участников лидером.
      4. Подача заявки группой на участие в секции мероприятия и её
         подтверждение организатором; после подтверждения смена группы
         запрещена.

servers:
  - url: /api/v1
    description: Базовый путь API

tags:
  - name: Registration
    description: Регистрация участника и подтверждение учётной записи
  - name: Auth
    description: Авторизация по одноразовому паролю
  - name: Groups
    description: Создание групп и управление их составом
  - name: SectionApplications
    description: Подача и подтверждение заявок группы на участие в секции

paths:
  # ------------------------------------------------------------------ #
  # 1. Регистрация участника                                           #
  # ------------------------------------------------------------------ #
  /registration/request:
    post:
      tags: [Registration]
      summary: Подать заявку на регистрацию участника
      description: |
        Создаёт запись в `people` и неподтверждённую запись в `participants`
        и отправляет на указанный e-mail письмо со ссылкой подтверждения,
        содержащей одноразовый токен.
      operationId: requestRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationRequest"
      responses:
        "202":
          description: Заявка принята, письмо подтверждения отправлено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationRequestResponse"
        "400":
          description: Некорректные входные данные
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Участник с таким e-mail уже зарегистрирован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /registration/confirm:
    post:
      tags: [Registration]
      summary: Подтвердить регистрацию по токену из письма
      description: |
        Активирует запись участника по одноразовому токену подтверждения,
        отправленному на e-mail.
      operationId: confirmRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationConfirmRequest"
      responses:
        "200":
          description: Регистрация подтверждена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Participant"
        "400":
          description: Некорректный или просроченный токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Заявка на регистрацию не найдена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ------------------------------------------------------------------ #
  # 2. Авторизация (OTP)                                               #
  # ------------------------------------------------------------------ #
  /auth/otp/request:
    post:
      tags: [Auth]
      summary: Запросить одноразовый пароль для входа
      description: |
        Генерирует одноразовый пароль и отправляет на e-mail подтверждённого участника.
        OTP действует ограниченное время.
      operationId: requestOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "202":
          description: OTP отправлен (если такой участник существует)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequestResponse"
        "400":
          description: Некорректный e-mail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Войти в систему с помощью OTP
      description: |
        Проверяет OTP и возвращает токен доступа
        (Bearer/JWT) для дальнейших авторизованных запросов.
      operationId: verifyOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyRequest"
      responses:
        "200":
          description: Успешная авторизация
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "401":
          description: Неверный или просроченный OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ------------------------------------------------------------------ #
  # 3. Группы                                                          #
  # ------------------------------------------------------------------ #
  /groups:
    post:
      tags: [Groups]
      summary: Создать группу и стать её лидером
      description: |
        Создаёт запись в `groups` (с `section_id`, `name`, `member_count = 1`,
        `registration_time = NOW()`), добавляет создателя в `group_participants`
        и выставляет `participants.is_group_leader = true` для текущего
        участника.
      operationId: createGroup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupCreateRequest"
      responses:
        "201":
          description: Группа создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Требуется авторизация
        "404":
          description: Секция не найдена
        "409":
          description: Участник уже состоит в другой группе
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /groups/{groupId}:
    get:
      tags: [Groups]
      summary: Получить информацию о группе
      operationId: getGroup
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Информация о группе
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "401":
          description: Требуется авторизация
        "404":
          description: Группа не найдена

  /groups/{groupId}/participants:
    post:
      tags: [Groups]
      summary: Добавить участника в группу (только лидер)
      description: |
        Лидер группы добавляет в свою группу подтверждённого участника
        (создаётся запись в `group_participants`, инкрементируется
        `groups.member_count`). Если по группе уже есть подтверждённая
        организатором заявка на участие в секции (см. флоу
        SectionApplications), изменение состава запрещено.
      operationId: addGroupParticipant
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupParticipantAddRequest"
      responses:
        "200":
          description: Участник добавлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Требуется авторизация
        "403":
          description: Только лидер группы может добавлять участников
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Группа или участник не найдены
        "409":
          description: |
            Участник уже состоит в другой группе либо состав группы
            зафиксирован подтверждённой заявкой на участие в секции.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /groups/{groupId}/participants/{participantId}:
    delete:
      tags: [Groups]
      summary: Удалить участника из группы (только лидер)
      description: |
        Удаляет запись из `group_participants` и декрементирует
        `groups.member_count`. Запрещено, если заявка группы на секцию
        уже подтверждена.
      operationId: removeGroupParticipant
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - in: path
          name: participantId
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Участник удалён
        "401":
          description: Требуется авторизация
        "403":
          description: Только лидер может удалять участников
        "404":
          description: Группа или участник не найдены
        "409":
          description: Состав группы зафиксирован подтверждённой заявкой

  # ------------------------------------------------------------------ #
  # 4. Заявки группы на секцию мероприятия                             #
  # ------------------------------------------------------------------ #
  /section-applications:
    post:
      tags: [SectionApplications]
      summary: Подать заявку группы на участие в секции мероприятия (только лидер)
      description: |
        Лидер группы подаёт заявку на участие группы в секции конкретного
        мероприятия. Связь «секция ↔ мероприятие» определяется таблицей
        `event_sections`; группа уже привязана к секции через `groups.section_id`,
        поэтому в заявке достаточно указать `groupId` и `eventId`.

        Заявка создаётся в статусе `PENDING` и ожидает подтверждения
        организатором мероприятия.
      operationId: createSectionApplication
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectionApplicationCreateRequest"
      responses:
        "201":
          description: Заявка создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionApplication"
        "400":
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Требуется авторизация
        "403":
          description: Только лидер группы может подавать заявку
        "404":
          description: Группа, секция или мероприятие не найдены
        "409":
          description: |
            У группы уже есть заявка на эту секцию мероприятия,
            либо секция не входит в состав указанного мероприятия
            (нет связи в `event_sections`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /section-applications/{applicationId}:
    get:
      tags: [SectionApplications]
      summary: Получить заявку по ID
      operationId: getSectionApplication
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: Заявка найдена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionApplication"
        "401":
          description: Требуется авторизация
        "404":
          description: Заявка не найдена

  /section-applications/{applicationId}/approve:
    post:
      tags: [SectionApplications]
      summary: Подтвердить заявку группы (только организатор)
      description: |
        Организатор подтверждает заявку группы на участие в секции своего
        мероприятия. Действие фиксируется в `organizer_section_changes`
        (и при необходимости в `organizer_participant_changes` для каждого
        участника группы).

        После подтверждения состав группы фиксируется: ни один участник
        не может быть добавлен или удалён, и участник не может перейти
        в другую группу.
      operationId: approveSectionApplication
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: Заявка подтверждена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionApplication"
        "401":
          description: Требуется авторизация
        "403":
          description: Только организатор данного мероприятия может подтверждать заявки
        "404":
          description: Заявка не найдена
        "409":
          description: Заявка уже находится в финальном статусе

  /section-applications/{applicationId}/reject:
    post:
      tags: [SectionApplications]
      summary: Отклонить заявку группы (только организатор)
      operationId: rejectSectionApplication
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectionApplicationRejectRequest"
      responses:
        "200":
          description: Заявка отклонена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionApplication"
        "401":
          description: Требуется авторизация
        "403":
          description: Только организатор данного мероприятия может отклонять заявки
        "404":
          description: Заявка не найдена
        "409":
          description: Заявка уже находится в финальном статусе

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    GroupId:
      in: path
      name: groupId
      required: true
      schema:
        type: integer
        minimum: 1
    ApplicationId:
      in: path
      name: applicationId
      required: true
      schema:
        type: integer
        minimum: 1

  schemas:
    # ---------- Person / Participant -------------------------------- #
    Person:
      type: object
      description: Запись из таблицы `people`
      required: [id, first_name, last_name, email]
      properties:
        id:
          type: integer
          minimum: 1
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        middle_name:
          type: string
          maxLength: 100
          nullable: true
        email:
          type: string
          format: email
          maxLength: 255
        title:
          type: string
          maxLength: 20
          nullable: true
        degree:
          type: string
          maxLength: 20
          nullable: true
        position:
          type: string
          maxLength: 50
          nullable: true
        workplace:
          type: string
          maxLength: 50
          nullable: true
        tg_name:
          type: string
          maxLength: 32
          nullable: true

    Participant:
      type: object
      description: |
        Запись из таблицы `participants` вместе с присоединённой записью
        `people` (через `person_id`). Поле `status` вычисляется на API-уровне
        по факту подтверждения e-mail.
      required:
        - id
        - person_id
        - person
        - section_id
        - is_group_leader
        - status
      properties:
        id:
          type: integer
          minimum: 1
        person_id:
          type: integer
          minimum: 1
        person:
          $ref: "#/components/schemas/Person"
        faculty_id:
          type: integer
          minimum: 1
          nullable: true
        course_id:
          type: integer
          minimum: 1
          nullable: true
        teacher_id:
          type: integer
          minimum: 1
          nullable: true
        section_id:
          type: integer
          minimum: 1
          nullable: true
        textbook_level_id:
          type: integer
          minimum: 1
          nullable: true
        is_poster_participant:
          type: boolean
        is_translators_participate:
          type: boolean
        has_translator_education:
          type: boolean
        is_group_leader:
          type: boolean
        is_notification_allowed:
          type: boolean
        presentation_topic:
          type: string
          maxLength: 100
          nullable: true
        status:
          type: string
          enum: [PENDING_CONFIRMATION, ACTIVE]
          description: |
            API-уровневый статус: `PENDING_CONFIRMATION` пока e-mail не
            подтверждён, `ACTIVE` после подтверждения.
        group_id:
          type: integer
          minimum: 1
          nullable: true
          description: ID текущей группы участника (через `group_participants`)

    # ---------- Registration ---------------------------------------- #
    RegistrationRequest:
      type: object
      required:
        - email
        - first_name
        - last_name
        - faculty_id
        - course_id
        - section_id
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        first_name:
          type: string
          maxLength: 100
          example: "Иван"
        last_name:
          type: string
          maxLength: 100
          example: "Иванов"
        middle_name:
          type: string
          maxLength: 100
          nullable: true
          example: "Иванович"
        tg_name:
          type: string
          maxLength: 32
          nullable: true
        faculty_id:
          type: integer
          minimum: 1
          description: FK на `faculties.id`
        course_id:
          type: integer
          minimum: 1
          description: FK на `courses.id`
        teacher_id:
          type: integer
          minimum: 1
          nullable: true
          description: FK на `teachers.id`
        section_id:
          type: integer
          minimum: 1
          description: FK на `sections.id`
        textbook_level_id:
          type: integer
          minimum: 1
          nullable: true
          description: FK на `textbook_levels.id`
        presentation_topic:
          type: string
          maxLength: 100
          nullable: true
        is_poster_participant:
          type: boolean
          default: false
        is_translators_participate:
          type: boolean
          default: false
        has_translator_education:
          type: boolean
          default: false
        is_notification_allowed:
          type: boolean
          default: true

    RegistrationRequestResponse:
      type: object
      required: [participant_id, email, status]
      properties:
        participant_id:
          type: integer
          minimum: 1
        email:
          type: string
          format: email
        status:
          type: string
          enum: [PENDING_CONFIRMATION]
        message:
          type: string
          example: "На указанный e-mail отправлено письмо подтверждения"

    RegistrationConfirmRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Одноразовый токен из письма подтверждения
          minLength: 16

    # ---------- Auth ------------------------------------------------- #
    OtpRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    OtpRequestResponse:
      type: object
      properties:
        message:
          type: string
          example: "Если такой участник существует, OTP отправлен на e-mail"
        expires_in_seconds:
          type: integer
          example: 300

    OtpVerifyRequest:
      type: object
      required: [email, otp]
      properties:
        email:
          type: string
          format: email
        otp:
          type: string
          description: Значение из `participants.password`
          minLength: 4
          maxLength: 100
          example: "482913"

    AuthTokenResponse:
      type: object
      required: [access_token, token_type, participant]
      properties:
        access_token:
          type: string
          description: JWT-токен для авторизованных запросов
        token_type:
          type: string
          enum: [Bearer]
        expires_in_seconds:
          type: integer
          example: 3600
        participant:
          $ref: "#/components/schemas/Participant"

    # ---------- Groups ---------------------------------------------- #
    GroupCreateRequest:
      type: object
      required: [name, section_id]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: "Группа А"
        section_id:
          type: integer
          minimum: 1
          description: FK на `sections.id` — секция, в рамках которой создаётся группа

    GroupParticipantAddRequest:
      type: object
      description: |
        Идентификация добавляемого участника. Должен быть указан
        либо `participant_id`, либо `email` (e-mail из связанной записи `people`).
      properties:
        participant_id:
          type: integer
          minimum: 1
        email:
          type: string
          format: email
      oneOf:
        - required: [participant_id]
        - required: [email]

    Group:
      type: object
      description: Запись из `groups` с раскрытым составом через `group_participants`
      required:
        - id
        - section_id
        - name
        - member_count
        - registration_time
        - leader_id
        - locked
        - participants
      properties:
        id:
          type: integer
          minimum: 1
        section_id:
          type: integer
          minimum: 1
        name:
          type: string
          maxLength: 100
        member_count:
          type: integer
          minimum: 1
        registration_time:
          type: string
          format: date-time
          description: Колонка `groups.registration_time`
        leader_id:
          type: integer
          minimum: 1
          description: ID участника-лидера (`participants.is_group_leader = true`)
        locked:
          type: boolean
          description: |
            Признак, что состав группы зафиксирован подтверждённой заявкой
            на секцию мероприятия. Ставится в `true` после успешного
            `approve` и блокирует изменения `group_participants`.
        participants:
          type: array
          items:
            $ref: "#/components/schemas/Participant"

    # ---------- Section Applications -------------------------------- #
    SectionApplicationCreateRequest:
      type: object
      required: [group_id, event_id]
      properties:
        group_id:
          type: integer
          minimum: 1
          description: FK на `groups.id`
        event_id:
          type: integer
          minimum: 1
          description: |
            FK на `events.id`. Секция определяется автоматически из
            `groups.section_id`; пара `(section_id, event_id)` должна
            присутствовать в `event_sections`.

    SectionApplicationRejectRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
          description: Причина отклонения заявки

    SectionApplication:
      type: object
      description: |
        Заявка группы на участие в секции мероприятия. На уровне БД
        моделируется как кортеж `(group_id, section_id, event_id)` со
        статусом, фиксируемым в `organizer_section_changes` /
        `organizer_participant_changes`.
      required:
        - id
        - group_id
        - section_id
        - event_id
        - status
        - created_at
      properties:
        id:
          type: integer
          minimum: 1
        group_id:
          type: integer
          minimum: 1
        section_id:
          type: integer
          minimum: 1
        event_id:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        decided_by_organizer_id:
          type: integer
          minimum: 1
          nullable: true
          description: FK на `organizers.id` — кто вынес решение
        rejection_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time
          nullable: true
          description: Соответствует `update_time` в `organizer_section_changes`

    # ---------- Common ---------------------------------------------- #
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Код ошибки
          example: "EMAIL_ALREADY_REGISTERED"
        message:
          type: string
          description: Человекочитаемое описание
        details:
          type: object
          additionalProperties: true
