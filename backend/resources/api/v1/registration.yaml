openapi: 3.0.3
info:
  title: Цифровой Управляющий Мероприятиями - Participant Registration API
  version: 1.0.0
  description: |
    API для регистрации участников мероприятия, авторизации, управления
    группами и подачи заявок на участие в секции мероприятия.

    Покрываемые флоу:
      1. Регистрация участника (заявка по e-mail; подтверждение e-mail
         выполняется неявно при первой успешной авторизации по OTP).
      2. Авторизация по одноразовому паролю (OTP), отправляемому на e-mail.
         Каждая успешная проверка OTP подтверждает владение e-mail.
      3. Создание группы лидером (без привязки к секции) и добавление
         участников лидером.
      4. Подача заявки группой на участие в секции мероприятия (секция
         указывается в момент подачи заявки) и её подтверждение
         организатором; после подтверждения смена группы запрещена.

servers:
  - url: /api/v1
    description: Базовый путь API

tags:
  - name: Registration
    description: Регистрация участника
  - name: Auth
    description: |
      Авторизация по одноразовому паролю. Успешная проверка OTP
      одновременно подтверждает владение e-mail.
  - name: Groups
    description: Создание групп и управление их составом
  - name: SectionApplications
    description: Подача и подтверждение заявок группы на участие в секции

paths:
  # ------------------------------------------------------------------ #
  # 1. Регистрация участника                                           #
  # ------------------------------------------------------------------ #
  /registration/request:
    post:
      tags: [Registration]
      summary: Подать заявку на регистрацию участника
      description: |
        Создаёт запись в `people` и запись в `participants`. Отдельное
        подтверждение e-mail не требуется: владение почтой подтверждается
        неявно при первой успешной авторизации по OTP
        (см. `/auth/otp/verify`).
      operationId: requestRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationRequest"
      responses:
        "201":
          description: Участник зарегистрирован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationRequestResponse"
        "400":
          description: Некорректные входные данные
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Участник с таким e-mail уже зарегистрирован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ------------------------------------------------------------------ #
  # 2. Авторизация (OTP)                                               #
  # ------------------------------------------------------------------ #
  /auth/otp/request:
    post:
      tags: [Auth]
      summary: Запросить одноразовый пароль для входа
      description: |
        Генерирует одноразовый пароль и отправляет на e-mail участника.
        OTP действует ограниченное время. Успешная проверка этого OTP
        в `/auth/otp/verify` одновременно подтверждает владение e-mail
        (отдельный шаг подтверждения регистрации не используется).
      operationId: requestOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "202":
          description: OTP отправлен (если такой участник существует)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequestResponse"
        "400":
          description: Некорректный e-mail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Войти в систему с помощью OTP
      description: |
        Проверяет OTP и возвращает токен доступа (Bearer/JWT) для
        дальнейших авторизованных запросов. Каждая успешная проверка OTP
        также подтверждает, что участник владеет указанным e-mail.
      operationId: verifyOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyRequest"
      responses:
        "200":
          description: Успешная авторизация
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "401":
          description: Неверный или просроченный OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ------------------------------------------------------------------ #
  # 3. Группы                                                          #
  # ------------------------------------------------------------------ #
  /groups:
    post:
      tags: [Groups]
      summary: Создать группу и стать её лидером
      description: |
        Создаёт запись в `groups` без привязки к секции (`section_id = NULL`,
        `registration_time = NULL`, `name`, `member_count = 1`), добавляет
        создателя в `group_participants` и выставляет
        `participants.is_group_leader = true` для текущего участника.
        Секция и время регистрации в секции выставляются позже —
        в момент подачи заявки на участие (см. `/section-applications`).
      operationId: createGroup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupCreateRequest"
      responses:
        "201":
          description: Группа создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Требуется авторизация
        "409":
          description: Участник уже состоит в другой группе
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /groups/{groupId}:
    get:
      tags: [Groups]
      summary: Получить информацию о группе
      operationId: getGroup
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Информация о группе
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "401":
          description: Требуется авторизация
        "404":
          description: Группа не найдена

  # ------------------------------------------------------------------ #
  # 4. Приглашения в группу (токены)                                   #
  # ------------------------------------------------------------------ #
  /groups/{groupId}/invite-token:
    post:
      tags: [Groups]
      summary: Создать токен приглашения в группу (только лидер)
      description: |
        Лидер группы создаёт одноразовый токен приглашения. Токен позволяет
        другому участнику присоединиться к группе. Токен действителен
        ограниченное время.
      operationId: createInviteToken
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "201":
          description: Токен создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteTokenResponse"
        "401":
          description: Требуется авторизация
        "403":
          description: Только лидер группы может создавать токены приглашения
        "404":
          description: Группа не найдена

  /groups/join/{token}:
    post:
      tags: [Groups]
      summary: Вступить в группу по токену приглашения
      description: |
        Участник использует токен приглашения для вступления в группу.
        После успешного вступления участник добавляется в `group_participants`.
      operationId: joinGroupByToken
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InviteToken"
      responses:
        "200":
          description: Успешное вступление в группу
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          description: Некорректный или просроченный токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Требуется авторизация
        "403":
          description: Участник уже состоит в другой группе
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Группа не найдена или токен недействителен

  # ------------------------------------------------------------------ #
  # 5. Заявки группы на секцию мероприятия                             #
  # ------------------------------------------------------------------ #
  /section-applications:
    post:
      tags: [SectionApplications]
      summary: Подать заявку группы на участие в секции мероприятия (только лидер)
      description: |
        Лидер группы подаёт заявку на участие группы в секции конкретного
        мероприятия. Связь «секция ↔ мероприятие» определяется таблицей
        `event_sections`. Группа создаётся без секции, поэтому в заявке
        обязательно указываются `group_id`, `section_id` и `event_id`.

        В момент создания заявки у группы выставляются
        `groups.section_id = section_id` и `groups.registration_time = NOW()`
        (если они ещё не были установлены). Заявка создаётся в статусе
        `PENDING` и ожидает подтверждения организатором мероприятия.
      operationId: createSectionApplication
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectionApplicationCreateRequest"
      responses:
        "201":
          description: Заявка создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionApplication"
        "400":
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Требуется авторизация
        "403":
          description: Только лидер группы может подавать заявку
        "404":
          description: Группа, секция или мероприятие не найдены
        "409":
          description: |
            У группы уже есть заявка на эту секцию мероприятия;
            секция не входит в состав указанного мероприятия
            (нет связи в `event_sections`); либо у группы уже
            установлена другая секция (`groups.section_id`),
            отличная от указанной в запросе.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /section-applications/{applicationId}:
    get:
      tags: [SectionApplications]
      summary: Получить заявку по ID
      operationId: getSectionApplication
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: Заявка найдена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionApplication"
        "401":
          description: Требуется авторизация
        "404":
          description: Заявка не найдена

  /section-applications/{applicationId}/approve:
    post:
      tags: [SectionApplications]
      summary: Подтвердить заявку группы (только организатор)
      description: |
        Организатор подтверждает заявку группы на участие в секции своего
        мероприятия. Действие фиксируется в `organizer_section_changes`
        (и при необходимости в `organizer_participant_changes` для каждого
        участника группы).

        После подтверждения состав группы фиксируется: ни один участник
        не может быть добавлен или удалён, и участник не может перейти
        в другую группу.
      operationId: approveSectionApplication
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: Заявка подтверждена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionApplication"
        "401":
          description: Требуется авторизация
        "403":
          description: Только организатор данного мероприятия может подтверждать заявки
        "404":
          description: Заявка не найдена
        "409":
          description: Заявка уже находится в финальном статусе

  /section-applications/{applicationId}/reject:
    post:
      tags: [SectionApplications]
      summary: Отклонить заявку группы (только организатор)
      operationId: rejectSectionApplication
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectionApplicationRejectRequest"
      responses:
        "200":
          description: Заявка отклонена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionApplication"
        "401":
          description: Требуется авторизация
        "403":
          description: Только организатор данного мероприятия может отклонять заявки
        "404":
          description: Заявка не найдена
        "409":
          description: Заявка уже находится в финальном статусе

  /person:
    put:
      tags:
        - Person
      summary: Обновить или создать информацию о пользователе
      description: |
        ID пользователя извлекается из JWT токена.
        Если пользователь с таким ID существует – обновляет данные, иначе создаёт нового.
      operationId: updatePerson
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonUpdate'
      responses:
        '200':
          description: Информация обновлена или создана успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonRead'
        '401':
          description: Требуется авторизация (отсутствует или недействительный токен)
        '403':
          description: Только сам пользователь может изменять свои данные
    post:
      tags:
        - Person
      summary: Создать информацию о пользователе (только если запись уже существует)
      description: |
        **Примечание:** по текущей реализации эндпоинт создаёт запись только при условии,
        что пользователь с указанным в JWT ID уже существует в базе.
        Иначе возвращает 409 Conflict.
      operationId: createPerson
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonUpdate'
      responses:
        '200':
          description: Пользователь успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonRead'
        '401':
          description: Требуется авторизация
        '409':
          description: Пользователь с таким ID не существует (создание невозможно)
    patch:
      tags:
        - Person
      summary: Частично обновить данные существующего пользователя
      description: |
        Обновляет только переданные поля.
        Если пользователь с ID из JWT не найден – возвращает 409 Conflict.
      operationId: updatePersonPartial
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonUpdate'
      responses:
        '200':
          description: Данные обновлены успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonRead'
        '401':
          description: Требуется авторизация
        '409':
          description: Пользователь с таким ID не найден
    get:
      tags:
        - Person
      summary: Получить информацию о пользователе по ID
      description: |
        Не требует аутентификации. Возвращает данные пользователя по переданному ID.
      operationId: getPersonById
      parameters:
        - name: person_id
          in: query
          required: true
          schema:
            type: integer
          description: ID пользователя
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonRead'
        '404':
          description: Пользователь не найден

  /person/me:
    get:
      tags:
        - Person
      summary: Получить данные текущего авторизованного пользователя
      description: ID пользователя извлекается из JWT токена.
      operationId: getMyPersonData
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Данные пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonRead'
        '401':
          description: Требуется авторизация
        '404':
          description: Пользователь не найден

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    GroupId:
      in: path
      name: groupId
      required: true
      schema:
        type: integer
        minimum: 1
    InviteToken:
      in: path
      name: token
      required: true
      schema:
        type: string
    ApplicationId:
      in: path
      name: applicationId
      required: true
      schema:
        type: integer
        minimum: 1

  schemas:
    # ---------- Person / Participant -------------------------------- #
    Person:
      type: object
      description: Запись из таблицы `people`
      required: [id, first_name, last_name, email]
      properties:
        id:
          type: integer
          minimum: 1
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        middle_name:
          type: string
          maxLength: 100
          nullable: true
        email:
          type: string
          format: email
          maxLength: 255
        title:
          type: string
          maxLength: 20
          nullable: true
        degree:
          type: string
          maxLength: 20
          nullable: true
        position:
          type: string
          maxLength: 50
          nullable: true
        workplace:
          type: string
          maxLength: 50
          nullable: true
        tg_name:
          type: string
          maxLength: 32
          nullable: true

    Participant:
      type: object
      description: |
        Запись из таблицы `participants` вместе с присоединённой записью
        `people` (через `person_id`). Поле `status` вычисляется на API-уровне
        по факту подтверждения e-mail.
      required:
        - id
        - person_id
        - person
        - section_id
        - is_group_leader
        - status
      properties:
        id:
          type: integer
          minimum: 1
        person_id:
          type: integer
          minimum: 1
        person:
          $ref: "#/components/schemas/Person"
        faculty_id:
          type: integer
          minimum: 1
          nullable: true
        course_id:
          type: integer
          minimum: 1
          nullable: true
        teacher_id:
          type: integer
          minimum: 1
          nullable: true
        section_id:
          type: integer
          minimum: 1
          nullable: true
        textbook_level_id:
          type: integer
          minimum: 1
          nullable: true
        is_poster_participant:
          type: boolean
        is_translators_participate:
          type: boolean
        has_translator_education:
          type: boolean
        is_group_leader:
          type: boolean
        is_notification_allowed:
          type: boolean
        presentation_topic:
          type: string
          maxLength: 100
          nullable: true
        status:
          type: string
          enum: [PENDING_CONFIRMATION, ACTIVE]
          description: |
            API-уровневый статус: `PENDING_CONFIRMATION` пока e-mail не
            подтверждён (т.е. участник ещё ни разу не авторизовался
            по OTP), `ACTIVE` после первой успешной авторизации по OTP.
        group_id:
          type: integer
          minimum: 1
          nullable: true
          description: ID текущей группы участника (через `group_participants`)

    # ---------- Registration ---------------------------------------- #
    RegistrationRequest:
      type: object
      required:
        - email
        - first_name
        - last_name
        - faculty_id
        - course_id
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        first_name:
          type: string
          maxLength: 100
          example: "Иван"
        last_name:
          type: string
          maxLength: 100
          example: "Иванов"
        middle_name:
          type: string
          maxLength: 100
          nullable: true
          example: "Иванович"
        tg_name:
          type: string
          maxLength: 32
          nullable: true
        faculty_id:
          type: integer
          minimum: 1
          description: FK на `faculties.id`
        course_id:
          type: integer
          minimum: 1
          description: FK на `courses.id`
        teacher_id:
          type: integer
          minimum: 1
          nullable: true
          description: FK на `teachers.id`
        textbook_level_id:
          type: integer
          minimum: 1
          nullable: true
          description: FK на `textbook_levels.id`
        presentation_topic:
          type: string
          maxLength: 100
          nullable: true
        is_poster_participant:
          type: boolean
          default: false
        is_translators_participate:
          type: boolean
          default: false
        has_translator_education:
          type: boolean
          default: false
        is_notification_allowed:
          type: boolean
          default: true

    RegistrationRequestResponse:
      type: object
      required: [participant_id, email, status]
      properties:
        participant_id:
          type: integer
          minimum: 1
        email:
          type: string
          format: email
        status:
          type: string
          enum: [PENDING_CONFIRMATION]
          description: |
            Участник создан, но e-mail ещё не подтверждён. Подтверждение
            произойдёт автоматически при первой успешной авторизации
            по OTP (`/auth/otp/verify`).
        message:
          type: string
          example: "Регистрация принята. Для входа запросите OTP на указанный e-mail."

    # ---------- Auth ------------------------------------------------- #
    OtpRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    OtpRequestResponse:
      type: object
      properties:
        message:
          type: string
          example: "Если такой участник существует, OTP отправлен на e-mail"
        expires_in_seconds:
          type: integer
          example: 300

    OtpVerifyRequest:
      type: object
      required: [email, otp]
      properties:
        email:
          type: string
          format: email
        otp:
          type: string
          description: Значение из `participants.password`
          minLength: 4
          maxLength: 100
          example: "482913"

    AuthTokenResponse:
      type: object
      required: [access_token, token_type, participant]
      properties:
        access_token:
          type: string
          description: JWT-токен для авторизованных запросов
        token_type:
          type: string
          enum: [Bearer]
        expires_in_seconds:
          type: integer
          example: 3600
        participant:
          $ref: "#/components/schemas/Participant"

    # ---------- Groups ---------------------------------------------- #
    GroupCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: "Группа А"

    GroupParticipantAddRequest:
      type: object
      description: |
        Идентификация добавляемого участника. Должен быть указан
        либо `participant_id`, либо `email` (e-mail из связанной записи `people`).
      properties:
        participant_id:
          type: integer
          minimum: 1
        email:
          type: string
          format: email
      oneOf:
        - required: [participant_id]
        - required: [email]

    InviteTokenResponse:
      type: object
      required: [token, expired_at]
      properties:
        token:
          type: string
          description: Одноразовый токен приглашения
        expired_at:
          type: string
          format: date-time
          description: Время жизни токена

    Group:
      type: object
      description: Запись из `groups` с раскрытым составом через `group_participants`
      required:
        - id
        - section_id
        - name
        - member_count
        - registration_time
        - leader_id
        - locked
        - participants
      properties:
        id:
          type: integer
          minimum: 1
        section_id:
          type: integer
          minimum: 1
          nullable: true
          description: |
            Секция, в которой группа выступает. `null` до момента подачи
            заявки на участие в секции; устанавливается при создании
            заявки в `/section-applications`.
        name:
          type: string
          maxLength: 100
        member_count:
          type: integer
          minimum: 1
        registration_time:
          type: string
          format: date-time
          nullable: true
          description: |
            Колонка `groups.registration_time`. `null` до подачи заявки
            на участие в секции; выставляется в момент создания заявки.
        leader_id:
          type: integer
          minimum: 1
          description: ID участника-лидера (`participants.is_group_leader = true`)
        locked:
          type: boolean
          description: |
            Признак, что состав группы зафиксирован подтверждённой заявкой
            на секцию мероприятия. Ставится в `true` после успешного
            `approve` и блокирует изменения `group_participants`.
        participants:
          type: array
          items:
            $ref: "#/components/schemas/Participant"

    # ---------- Section Applications -------------------------------- #
    SectionApplicationCreateRequest:
      type: object
      required: [group_id, section_id, event_id]
      properties:
        group_id:
          type: integer
          minimum: 1
          description: FK на `groups.id`
        section_id:
          type: integer
          minimum: 1
          description: |
            FK на `sections.id` — секция, в которой группа хочет
            участвовать. При создании заявки это значение выставляется
            в `groups.section_id` (если ранее не было установлено).
            Пара `(section_id, event_id)` должна присутствовать
            в `event_sections`.
        event_id:
          type: integer
          minimum: 1
          description: FK на `events.id`.

    SectionApplicationRejectRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
          description: Причина отклонения заявки

    SectionApplication:
      type: object
      description: |
        Заявка группы на участие в секции мероприятия. На уровне БД
        моделируется как кортеж `(group_id, section_id, event_id)` со
        статусом, фиксируемым в `organizer_section_changes` /
        `organizer_participant_changes`.
      required:
        - id
        - group_id
        - section_id
        - event_id
        - status
        - created_at
      properties:
        id:
          type: integer
          minimum: 1
        group_id:
          type: integer
          minimum: 1
        section_id:
          type: integer
          minimum: 1
        event_id:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        decided_by_organizer_id:
          type: integer
          minimum: 1
          nullable: true
          description: FK на `organizers.id` — кто вынес решение
        rejection_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time
          nullable: true
          description: Соответствует `update_time` в `organizer_section_changes`

    PersonBase:
      type: object
      description: Базовая информация о пользователе (без ID)
      properties:
        first_name:
          type: string
          nullable: true
          description: Имя
        last_name:
          type: string
          nullable: true
          description: Фамилия
        middle_name:
          type: string
          nullable: true
          description: Отчество
        email:
          type: string
          format: email
          nullable: true
          description: Email
        title:
          type: string
          nullable: true
          description: Обращение (г-н, проф., и т.п.)
        degree:
          type: string
          nullable: true
          description: Учёная степень
        position:
          type: string
          nullable: true
          description: Должность
        workplace:
          type: string
          nullable: true
          description: Место работы
        tg_name:
          type: string
          nullable: true
          description: Имя пользователя в Telegram
      example:
        first_name: "Иван"
        last_name: "Петров"
        middle_name: "Сергеевич"
        email: "ivan@example.com"
        title: "г-н"
        degree: "канд. техн. наук"
        position: "ведущий инженер"
        workplace: "ООО «Технологии»"
        tg_name: "@ivan_petrov"

    PersonRead:
      allOf:
        - $ref: '#/components/schemas/PersonBase'
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
              description: Уникальный идентификатор пользователя
      description: Полная информация о пользователе (для чтения)

    PersonUpdate:
      $ref: '#/components/schemas/PersonBase'
      description: Объект для обновления/создания данных пользователя (все поля опциональны)

    # ---------- Common ---------------------------------------------- #
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Код ошибки
          example: "EMAIL_ALREADY_REGISTERED"
        message:
          type: string
          description: Человекочитаемое описание
        details:
          type: object
          additionalProperties: true
